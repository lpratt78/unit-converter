name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/UnitConverter.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/UnitConverter.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: UnitConverter-win-x64
          path: publish/UnitConverter.exe

      # Every push to main becomes a numbered release, so this link always has the newest exe:
      # https://github.com/lpratt78/unit-converter/releases/latest/download/UnitConverter.exe
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Unit Converter 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Single-file Windows app. Download UnitConverter.exe and double-click it; no install needed.
          files: publish/UnitConverter.exe
